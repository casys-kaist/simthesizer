# Profiled on:
#   GPU        NVIDIA RTX PRO 6000 Blackwell Server Edition (96 GiB, compute capability 12.0)
#   Topology   4 devices, no NVLink. Pairs (0,1) and (2,3) share a PCIe switch;
#              across pairs the path crosses the inter-socket link.
# Latencies in the generated CSV are specific to this device. Re-profile with
# scripts/vllm-profile.py before trusting them on other hardware.

vllm_config:
  model: "nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16"
  tensor_parallel_size: 1
  dtype: half
  load_format: "dummy"
  block_size: 16
  max_num_batched_tokens: 8192
  max_num_seqs: 256
  gpu_memory_utilization: 0.9
  enforce_eager: true
  skip_tokenizer_init: true
  enable_prefix_caching: false
  trust_remote_code: true
  generation_config: "vllm"
  hf_overrides:
    num_hidden_layers: 3
    hybrid_override_pattern: "ME*"
profile_tp: [1, 2]
num_experts: 128
num_experts_per_token: 6
tp_modifications:
  - intermediate_size
  - num_attention_heads
  - num_key_value_heads
  - mamba_num_heads
  - vocab_size
layers:
  NemotronHForCausalLM:
    VocabParallelEmbedding: embedding
    NemotronHMambaDecoderLayer:
      RMSNorm: layernorm
      MambaMixer2: mamba
    NemotronHMoEDecoderLayer:
      RMSNorm: layernorm
      NemotronHMoE: moe
    NemotronHAttentionDecoderLayer:
      RMSNorm: layernorm
      NemotronHAttention:
        QKVParallelLinear: qkv_projection
        Attention: attention
        RowParallelLinear: o_projection
    RMSNorm: final_layernorm
  LogitsProcessor: lm_head
  Sampler: sampler
layer_modes:
  general:
    - embedding
    - qkv_projection
    - o_projection
  tp_agnostic:
    - layernorm
    - final_layernorm
  lm_head:
    - lm_head
  sampler:
    - sampler
  attention:
    - attention
    - mamba
  moe:
    - moe
