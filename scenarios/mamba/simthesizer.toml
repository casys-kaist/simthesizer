[system]
kind = "moe_ep_multi_instance"

[system.router]
kind = "moe_load_balancing"

[system.model_runner]
kind = "moe_ep"
ep = 2
link_bw = 60397977600.0
link_latency = 0.0

[system.model_runner.compute_sim]
kind = "table_lookup"
perf_dir = "../../data/nemotron3_nano_30b_a3b.csv"

[system.model_runner.network_sim]
kind = "flow"

[[system.schedulers]]
kind = "chunked_prefill"
block_size = 16
max_batch = 32
max_num_batched_tokens = 2048
device_mem = 102641958912
device_mem_utilization = 0.9
enable_prefix_caching = false

[[system.schedulers]]
kind = "chunked_prefill"
block_size = 16
max_batch = 32
max_num_batched_tokens = 2048
device_mem = 102641958912
device_mem_utilization = 0.9
enable_prefix_caching = false

[system.model]
kind = "nemotron_h"
hidden_size = 2688
intermediate_size = 1856
num_hidden_layers = 52
hybrid_override_pattern = "MEMEM*EMEMEM*EMEMEM*EMEMEM*EMEMEM*EMEMEMEM*EMEMEMEME"
num_attention_heads = 32
head_dim = 128
num_key_value_heads = 2
vocab_size = 131072
mamba_num_heads = 64
mamba_head_dim = 64
n_groups = 8
ssm_state_size = 128
conv_kernel = 4
moe_intermediate_size = 1856
moe_shared_expert_intermediate_size = 3712
n_routed_experts = 128
n_shared_experts = 1
num_experts_per_tok = 6
use_bias = false
use_conv_bias = true
mamba_ssm_state_dtype_bytes = 4
